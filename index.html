<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小助手阿焙焙">
<meta name="theme-color" content="#EAF4FF">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>小助手阿焙焙</title>
</head>
<body>
<header class="topbar">
  <!-- 焙子的插圖都在 art/，由電腦版資料夾的 art/make_baozi_art.py 處理，電腦版和手機版用同一批圖 -->
  <img class="logo" src="art/avatar.png" alt="">
  <div class="topbar-text">
    <h1>小助手阿焙焙</h1>
    <p id="topbar-sub">今天也辛苦了 ⭐</p>
  </div>
  <span id="sync-status" class="sync-status"></span>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button data-tab="todo"><span class="tab-icon">📅</span><span>每日待辦</span></button>
  <button data-tab="calendar"><span class="tab-icon">📆</span><span>行事曆</span></button>
  <button data-tab="progress"><span class="tab-icon">📊</span><span>客戶進度</span></button>
  <button data-tab="generate"><span class="tab-icon">💌</span><span>產生文字</span></button>
  <button data-tab="manage"><span class="tab-icon">⚙️</span><span>管理</span></button>
</nav>

<div id="sheet-root"></div>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
