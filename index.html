<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳小幫手">
<meta name="theme-color" content="#EAF4FF">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>記帳小幫手</title>
</head>
<body>
<header class="topbar">
  <!-- 小貓插圖：跟電腦版 make_cat_face 同一隻（座標 100x100），改圖案時兩邊要一起改 -->
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="50" fill="#FFB8CE"/>
    <path d="M20 44 L25 14 L46 30 Z M80 44 L75 14 L54 30 Z" fill="#fff"/>
    <path d="M26 37 L28.5 21 L40 30 Z M74 37 L71.5 21 L60 30 Z" fill="#FFD6E6"/>
    <ellipse cx="50" cy="55" rx="33" ry="28" fill="#fff"/>
    <path d="M22 59 L9 55 M22 64 L9 66 M78 59 L91 55 M78 64 L91 66" stroke="#4A4458" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="30" cy="62" rx="5" ry="3" fill="#FFB3C7"/>
    <ellipse cx="70" cy="62" rx="5" ry="3" fill="#FFB3C7"/>
    <ellipse cx="38" cy="52" rx="4" ry="5" fill="#4A4458"/>
    <ellipse cx="62" cy="52" rx="4" ry="5" fill="#4A4458"/>
    <circle cx="38" cy="50" r="1.5" fill="#fff"/>
    <circle cx="62" cy="50" r="1.5" fill="#fff"/>
    <path d="M46.5 60 L53.5 60 L50 63.5 Z" fill="#FF7A9A"/>
    <path d="M49.79 64.37 A3.5 4 0 0 1 43.21 64.37 M56.79 64.37 A3.5 4 0 0 1 50.21 64.37" fill="none" stroke="#4A4458" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <div class="topbar-text">
    <h1>記帳小幫手</h1>
    <p id="topbar-sub">今天也辛苦了 ⭐</p>
  </div>
  <span id="sync-status" class="sync-status"></span>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button data-tab="todo"><span class="tab-icon">📅</span><span>每日待辦</span></button>
  <button data-tab="calendar"><span class="tab-icon">📆</span><span>行事曆</span></button>
  <button data-tab="progress"><span class="tab-icon">📊</span><span>客戶進度</span></button>
  <button data-tab="generate"><span class="tab-icon">💌</span><span>產生文字</span></button>
  <button data-tab="manage"><span class="tab-icon">⚙️</span><span>管理</span></button>
</nav>

<div id="sheet-root"></div>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
